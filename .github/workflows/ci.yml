name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: precocaindo
          POSTGRES_PASSWORD: precocaindo
          POSTGRES_DB: precocaindo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U precocaindo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://precocaindo:precocaindo@localhost:5432/precocaindo
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      AMAZON_PROVIDER: mock
      CONTENT_GENERATION: mock
      AMAZON_ASSOCIATE_TAG: precocaindo-ci-20
      AMAZON_ASSOCIATE_DISCLOSURE: "Como participante do Programa de Associados da Amazon, sou remunerado pelas compras qualificadas efetuadas."
      AMAZON_POLICY_REVIEW_DATE: "2026-08-17"
      # Real root cause found 2026-11-25 (investigating 7 CI-only test
      # failures, reproduced locally against a truly fresh database with
      # this exact minimal env set, fixed by adding these 4 lines, 0
      # changes to test logic): this block was missing several variables
      # .env.example documents as the standard DEVELOPMENT/mock
      # configuration (see its own "THREE ENVIRONMENT SHAPES" header),
      # which several tests' fixtures implicitly assume are set.
      # PUBLIC_CATALOG_ENABLED/MANUAL_PRODUCTS_ENABLED control which
      # dataSource rows lib/queries/products.ts treats as publicly
      # visible (lib/config/public-catalog.ts) — without them, fixture
      # products created by tests/marketplace-data-isolation.test.ts and
      # tests/search-unified-offers.test.ts are invisible to the very
      # queries being tested. ADMIN_PASSWORD_HASH is a dummy,
      # never-a-real-password value (isAdminAuthConfigured() only checks
      # it starts with "scrypt:") — without it, tests/owner-traffic.test.ts
      # and tests/pageview-owner-notify.test.ts silently skip the entire
      # admin-session branch of isOwnerRequest(). AMAZON_BR_ENABLED/
      # AMAZON_BR_ASSOCIATE_TAG are public affiliate-tag config (same
      # category as AMAZON_ASSOCIATE_TAG above, never a secret) that
      # tests/merchant-redirect-amazon-regression.test.ts's fallback-to-
      # Special-Link path needs configured to build a URL at all.
      PUBLIC_CATALOG_ENABLED: "true"
      MANUAL_PRODUCTS_ENABLED: "true"
      ADMIN_PASSWORD_HASH: "scrypt:ci-dummy-salt-never-real:ci-dummy-hash-never-a-real-password"
      AMAZON_BR_ENABLED: "true"
      AMAZON_BR_ASSOCIATE_TAG: precocaindo-ci-20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migration validation (apply all migrations to a fresh database)
        run: npm run db:deploy

      - name: Test
        run: npm test

      - name: Amazon compliance gate
        run: npm run amazon:compliance

      - name: Privacy / compliance / security tests
        run: npx vitest run tests/price-alert.test.ts tests/amazon-policy-guard.test.ts tests/content-quality-gate-scaled-abuse.test.ts tests/slug-redirect.test.ts tests/structured-data.test.ts tests/admin-auth.test.ts tests/marketplace-data-isolation.test.ts tests/jobs-cycle-lock.test.ts tests/health.test.ts

      - name: Build
        run: npm run build
