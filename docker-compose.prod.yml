# Production stack for a single Ubuntu VPS — see docs/DEPLOYMENT.md.
#
# Three services: Postgres (persistent volume), the Next.js app (built
# from ./Dockerfile), and Caddy as the reverse proxy — Caddy gets automatic
# Let's Encrypt HTTPS from a two-line Caddyfile with no separate
# certbot/cron setup, which is the whole reason it was picked over nginx
# for a small, single-domain deployment.
#
# Usage:
#   docker compose -p precocaindo -f docker-compose.prod.yml up -d --build
#   docker compose -p precocaindo -f docker-compose.prod.yml exec app node node_modules/prisma/build/index.js migrate deploy
#
# Requires a `.env` file next to this compose file with production values
# — see .env.example's "PRODUCTION LIVE" section. Never commit that file.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-precocaindo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-precocaindo}
    volumes:
      - precocaindo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-precocaindo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* vars are baked in at Next.js build time, not read at
        # container runtime — env_file below is too late for this one.
        # Confirmed missing during the Stage 2 VPS rollout (see Dockerfile's
        # ARG NEXT_PUBLIC_SITE_URL comment); wired here too so this compose
        # file doesn't silently bake in the localhost fallback.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, web]
    # The production VPS's actual reverse proxy is a host-level nginx site
    # (/etc/nginx/sites-available/precocaindo), not the `caddy` service
    # below — nginx's upstream is hardcoded to 127.0.0.1:3100. Without
    # this published port, `app` is only reachable from other containers
    # on the `web`/`internal` networks, and nginx 502s (confirmed in
    # production, 2026-09-14). Bound to loopback only — never exposed
    # beyond this host.
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [web]

networks:
  internal:
  web:

volumes:
  # Pinned to the exact pre-existing Docker volume name, bypassing
  # Compose's default `${project}_${name}` prefixing — the real data
  # volume on the production VPS was created before the `-p precocaindo`
  # convention was adopted and is named `precocaindo_db_data`, not
  # `precocaindo_precocaindo_db_data`. Without `name:` here, a compose
  # invocation with `-p precocaindo` creates a second, empty volume with
  # the double-prefixed name and the app/db end up pointed at it instead
  # of the real data (confirmed happening in production, 2026-09-14).
  precocaindo_db_data:
    name: precocaindo_db_data
  caddy_data:
  caddy_config:
